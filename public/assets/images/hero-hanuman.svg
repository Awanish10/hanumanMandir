<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="45%" stop-color="#FCD385" />
      <stop offset="75%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#9C2706" />
    </radialGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FFE885" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#F28C28" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C65316" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGada" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6B0" />
      <stop offset="40%" stop-color="#E2AE38" />
      <stop offset="80%" stop-color="#9E690B" />
      <stop offset="100%" stop-color="#5E3802" />
    </linearGradient>
    <linearGradient id="bodySkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE73" />
      <stop offset="60%" stop-color="#E67332" />
      <stop offset="100%" stop-color="#B24410" />
    </linearGradient>
    <linearGradient id="vastra" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#8B1E1E" />
    </linearGradient>
  </defs>

  <!-- Devotional Background Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)" />

  <!-- Sacred Geometric Mandala Aura -->
  <g transform="translate(400, 240)" opacity="0.35">
    <circle r="190" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" />
    <circle r="170" fill="none" stroke="#D4A64A" stroke-width="3" />
    <circle r="150" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Rays -->
    <path d="M0 -200 L0 200 M-200 0 L200 0 M-140 -140 L140 140 M-140 140 L140 -140" stroke="#FFEBA3" stroke-width="2" />
    <!-- 12 Petals -->
    <circle cx="0" cy="-170" r="12" fill="#D4A64A" />
    <circle cx="0" cy="170" r="12" fill="#D4A64A" />
    <circle cx="-170" cy="0" r="12" fill="#D4A64A" />
    <circle cx="170" cy="0" r="12" fill="#D4A64A" />
    <circle cx="-120" cy="-120" r="10" fill="#FFEBA3" />
    <circle cx="120" cy="-120" r="10" fill="#FFEBA3" />
    <circle cx="-120" cy="120" r="10" fill="#FFEBA3" />
    <circle cx="120" cy="120" r="10" fill="#FFEBA3" />
  </g>

  <!-- Luminous Halo behind Head -->
  <circle cx="400" cy="220" r="145" fill="url(#auraGlow)" />

  <!-- Ornate Crown (Mukut) Base -->
  <path d="M330 160 L470 160 L450 90 L400 40 L350 90 Z" fill="url(#goldGada)" stroke="#8B1E1E" stroke-width="3" />
  <circle cx="400" cy="95" r="12" fill="#8B1E1E" />
  <circle cx="400" cy="95" r="6" fill="#FFF2A3" />
  <circle cx="370" cy="130" r="8" fill="#D4A64A" />
  <circle cx="430" cy="130" r="8" fill="#D4A64A" />

  <!-- Divine Face Profile / Silhouette -->
  <!-- Cheeks, Chin, Head -->
  <ellipse cx="400" cy="225" rx="68" ry="72" fill="url(#bodySkin)" />
  <!-- Kundal (Earrings) -->
  <circle cx="325" cy="235" r="16" fill="url(#goldGada)" stroke="#8B1E1E" stroke-width="2" />
  <circle cx="475" cy="235" r="16" fill="url(#goldGada)" stroke="#8B1E1E" stroke-width="2" />

  <!-- Ramanandi Tilak -->
  <path d="M388 170 Q394 210 394 235 Q400 240 406 235 Q406 210 412 170 Z" fill="#FFFFFF" />
  <path d="M397 185 Q400 220 400 230 Q403 220 403 185 Z" fill="#8B1E1E" />
  <circle cx="400" cy="235" r="3" fill="#D4A64A" />

  <!-- Peaceful Eyes & Eyebrows -->
  <path d="M355 195 Q375 190 388 200" stroke="#3D2418" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M445 195 Q425 190 412 200" stroke="#3D2418" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M360 205 Q375 215 388 207" stroke="#3D2418" stroke-width="3" fill="#FFFFFF" />
  <circle cx="375" cy="207" r="4.5" fill="#3D2418" />
  <path d="M440 205 Q425 215 412 207" stroke="#3D2418" stroke-width="3" fill="#FFFFFF" />
  <circle cx="425" cy="207" r="4.5" fill="#3D2418" />

  <!-- Sacred Mukh & Smarak -->
  <path d="M380 240 Q400 252 420 240" stroke="#8B1E1E" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M385 248 Q400 262 415 248" stroke="#8B1E1E" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Powerful Shoulders & Torso -->
  <path d="M260 360 Q320 280 400 285 Q480 280 540 360 L570 560 L230 560 Z" fill="url(#bodySkin)" />

  <!-- Sacred Janeu (यज्ञोपवीत) -->
  <path d="M330 295 Q400 390 490 530" stroke="#FFFDF9" stroke-width="4" stroke-dasharray="8 4" fill="none" />
  <path d="M333 298 Q403 393 493 533" stroke="#D4A64A" stroke-width="1.5" fill="none" />

  <!-- Muktahar / Garland (पुष्पहार) -->
  <path d="M310 320 Q400 440 490 320" stroke="none" fill="none" id="garlandPath" />
  <!-- Marigold Petals along neck -->
  <g fill="#F28C28" stroke="#8B1E1E" stroke-width="1.5">
    <circle cx="325" cy="330" r="14" fill="#FFAE00" />
    <circle cx="348" cy="360" r="14" fill="#F28C28" />
    <circle cx="378" cy="385" r="15" fill="#FFAE00" />
    <circle cx="400" cy="392" r="16" fill="#8B1E1E" />
    <circle cx="422" cy="385" r="15" fill="#FFAE00" />
    <circle cx="452" cy="360" r="14" fill="#F28C28" />
    <circle cx="475" cy="330" r="14" fill="#FFAE00" />
  </g>

  <!-- Golden Gada on Shoulder -->
  <g transform="translate(490, 200) rotate(22)">
    <!-- Gada Handle -->
    <rect x="0" y="80" width="18" height="280" rx="9" fill="url(#goldGada)" stroke="#3D2418" stroke-width="2" />
    <!-- Gada Head (Sphere / Ornate Bulb) -->
    <ellipse cx="9" cy="50" rx="52" ry="58" fill="url(#goldGada)" stroke="#8B1E1E" stroke-width="3" />
    <!-- Grooves & Gems -->
    <line x1="-38" y1="50" x2="56" y2="50" stroke="#8B1E1E" stroke-width="3" />
    <circle cx="9" cy="50" r="16" fill="#8B1E1E" />
    <circle cx="9" cy="50" r="8" fill="#FFF8E8" />
    <!-- Finial -->
    <path d="M2 0 L16 0 L9 -25 Z" fill="url(#goldGada)" stroke="#8B1E1E" stroke-width="2" />
  </g>

  <!-- Blessing Hand (अभय मुद्रा) -->
  <g transform="translate(260, 360)">
    <circle cx="45" cy="45" r="42" fill="url(#bodySkin)" />
    <!-- Palm center red Mahavar / Lotus -->
    <circle cx="45" cy="45" r="14" fill="#8B1E1E" opacity="0.85" />
    <text x="45" y="49" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="bold" fill="#FFF8E8" text-anchor="middle">राम</text>
  </g>

  <!-- Saffron Devotional Dhwaja in background -->
  <g transform="translate(680, 80)">
    <line x1="0" y1="0" x2="0" y2="480" stroke="#D4A64A" stroke-width="5" />
    <path d="M0 20 L95 70 L0 120 Z" fill="#F28C28" stroke="#8B1E1E" stroke-width="2" />
    <text x="25" y="75" font-family="'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="bold" fill="#8B1E1E">ॐ</text>
  </g>

  <!-- Bottom Sacred Lotus Base / Decorative Border -->
  <rect x="0" y="550" width="800" height="50" fill="#8B1E1E" />
  <line x1="0" y1="550" x2="800" y2="550" stroke="#D4A64A" stroke-width="4" />
  <text x="400" y="582" font-family="'Noto Sans Devanagari', sans-serif" font-size="22" font-weight="bold" fill="#FFF8E8" text-anchor="middle">॥ जय श्री राम ॥ जय श्री हनुमान ॥</text>
</svg>
