<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="gadaBgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="35%" stop-color="#FDBA74" />
      <stop offset="75%" stop-color="#C65316" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>
    <linearGradient id="gadaMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#gadaBgGlow)" />

  <!-- Radiance behind Gada -->
  <circle cx="300" cy="180" r="140" fill="url(#auraGlow)" opacity="0.8" />

  <!-- Sacred Lotus Base (कमल पुष्प) -->
  <g transform="translate(300, 310)">
    <!-- Lotus Petals -->
    <path d="M-60 0 C-70 -30 -30 -40 0 0 C30 -40 70 -30 60 0 Z" fill="#F43F5E" stroke="#881337" stroke-width="1.5" />
    <path d="M-90 0 C-100 -25 -60 -35 -30 0 C0 -35 40 -25 30 0" fill="#FB7185" stroke="#9F1239" stroke-width="1.5" />
    <path d="M-40 5 C-20 -20 20 -20 40 5" fill="#FDA4AF" />
  </g>

  <!-- Golden Gada (गदा) positioned upright and majestic -->
  <g transform="translate(300, 185)">
    <!-- Gada Handle Shaft (दण्ड) -->
    <rect x="-10" y="-30" width="20" height="150" rx="6" fill="url(#gadaMetal)" stroke="#78350F" stroke-width="2" />
    <!-- Handle Ring Grip Ribs -->
    <line x1="-12" y1="10" x2="12" y2="10" stroke="#FEF08A" stroke-width="4" />
    <line x1="-12" y1="40" x2="12" y2="40" stroke="#FEF08A" stroke-width="4" />
    <line x1="-12" y1="70" x2="12" y2="70" stroke="#FEF08A" stroke-width="4" />
    <!-- Bottom Handle Pommel (मुठिया) -->
    <circle cx="0" cy="125" r="16" fill="url(#gadaMetal)" stroke="#78350F" stroke-width="2" />
    <circle cx="0" cy="125" r="7" fill="#FEF08A" />

    <!-- Gada Head (मस्तक) - Fluted Heavy Globe with spikes and filigree -->
    <g transform="translate(0, -60)">
      <!-- Main spherical head -->
      <ellipse cx="0" cy="0" rx="65" ry="55" fill="url(#gadaMetal)" stroke="#78350F" stroke-width="3" />
      <ellipse cx="0" cy="0" rx="42" ry="54" fill="none" stroke="#FEF08A" stroke-width="3" opacity="0.9" />
      <ellipse cx="0" cy="0" rx="18" ry="54" fill="none" stroke="#FFF" stroke-width="2.5" opacity="0.9" />
      <!-- Central Gem / Medallion -->
      <circle cx="0" cy="0" r="14" fill="#DC2626" stroke="#FEF08A" stroke-width="2" />

      <!-- Top Finial Spike (शीर्ष कलश) -->
      <path d="M-15 -55 Q0 -90 0 -95 Q0 -90 15 -55 Z" fill="url(#gadaMetal)" stroke="#78350F" stroke-width="2" />
      <circle cx="0" cy="-95" r="6" fill="#FEF08A" stroke="#78350F" stroke-width="1.5" />
    </g>
  </g>

  <!-- Devotional Label Banner -->
  <rect x="160" y="345" width="280" height="40" rx="20" fill="#8B1E1E" stroke="#D4A64A" stroke-width="2" />
  <text x="300" y="371" font-family="'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="bold" fill="#FFF8E8" text-anchor="middle">श्री बजरंगबली की गदा एवं अस्त्र</text>
</svg>
