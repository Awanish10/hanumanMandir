<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="skyDawn" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="50%" stop-color="#F7A250" />
      <stop offset="100%" stop-color="#9C2706" />
    </radialGradient>
    <radialGradient id="divineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFDD7A" />
      <stop offset="100%" stop-color="#F28C28" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyDawn)" />
  <!-- Mountain Silhouette -->
  <path d="M0 400 L80 270 L190 340 L310 220 L450 350 L540 260 L600 320 L600 400 Z" fill="#60180B" />
  <path d="M0 400 L140 310 L280 400 L390 320 L510 400 L600 350 L600 400 Z" fill="#3D0F06" />
  
  <!-- Divine Halo & Infant Maruti / Prasad -->
  <circle cx="300" cy="180" r="110" fill="url(#divineGlow)" />
  
  <!-- Divine Cloud & Wind Streams -->
  <path d="M120 160 Q200 130 300 150 Q400 170 480 130" stroke="#FFEBB0" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M160 190 Q250 210 320 180 Q420 150 460 210" stroke="#FFF8E8" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round" />

  <!-- Cradle / Lotus / Devotional Symbol of Birth -->
  <g transform="translate(300, 200)">
    <!-- Golden Lotus -->
    <path d="M-60 40 Q0 0 60 40 Q40 70 -40 70 Z" fill="#D4A64A" stroke="#8B1E1E" stroke-width="2" />
    <path d="M-30 20 Q0 -20 30 20 Q15 40 -15 40 Z" fill="#F28C28" />
    <!-- Radiant Bal Maruti Silhouette -->
    <circle cx="0" cy="-20" r="26" fill="#FFAE73" />
    <circle cx="0" cy="-20" r="32" fill="none" stroke="#FFEBB0" stroke-width="3" stroke-dasharray="4,3" />
    <!-- Bal Mukut -->
    <path d="M-15 -35 L15 -35 L0 -55 Z" fill="#D4A64A" stroke="#8B1E1E" stroke-width="1.5" />
    <circle cx="0" cy="-45" r="3" fill="#8B1E1E" />
  </g>

  <!-- Title Badge -->
  <rect x="180" y="340" width="240" height="42" rx="21" fill="#8B1E1E" stroke="#D4A64A" stroke-width="2" />
  <text x="300" y="367" font-family="'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="bold" fill="#FFF8E8" text-anchor="middle">हनुमान जी का जन्म</text>
</svg>
