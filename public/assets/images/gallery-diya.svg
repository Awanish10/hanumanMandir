<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="diyaGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFEA79" />
      <stop offset="60%" stop-color="#FF7B00" />
      <stop offset="100%" stop-color="#8B1E1E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="brassThali" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="50%" stop-color="#D4A64A" />
      <stop offset="100%" stop-color="#875E19" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#240A04" />

  <!-- Luminous Aarti Radiance -->
  <circle cx="300" cy="200" r="160" fill="url(#diyaGlow)" opacity="0.85" />

  <!-- Sacred Brass Aarti Thali (आरती थाल) -->
  <g transform="translate(300, 240)">
    <!-- Thali Outer Rim -->
    <ellipse cx="0" cy="30" rx="200" ry="80" fill="url(#brassThali)" stroke="#4E3307" stroke-width="3" />
    <ellipse cx="0" cy="26" rx="180" ry="70" fill="#B3862D" stroke="#FFEAA7" stroke-width="1.5" />
    <ellipse cx="0" cy="22" rx="160" ry="60" fill="#946C1E" />

    <!-- Fresh Marigold Petals on Thali rim (गेंदे के पुष्प) -->
    <g fill="#FFA500" stroke="#8B1E1E" stroke-width="1">
      <circle cx="-130" cy="25" r="14" fill="#F59E0B" />
      <circle cx="-100" cy="45" r="12" fill="#EAB308" />
      <circle cx="-60" cy="55" r="14" fill="#F59E0B" />
      <circle cx="0" cy="60" r="14" fill="#EAB308" />
      <circle cx="60" cy="55" r="14" fill="#F59E0B" />
      <circle cx="100" cy="45" r="12" fill="#EAB308" />
      <circle cx="130" cy="25" r="14" fill="#F59E0B" />
    </g>

    <!-- Kumkum & Akshat Katori (कुमकुम-चावल) -->
    <ellipse cx="-80" cy="15" rx="24" ry="12" fill="url(#brassThali)" stroke="#875E19" stroke-width="1" />
    <ellipse cx="-80" cy="13" rx="20" ry="10" fill="#DC2626" />
    <circle cx="-78" cy="12" r="2" fill="#FFFDF5" />
    <circle cx="-83" cy="13" r="2" fill="#FFFDF5" />

    <!-- Camphor burner (कपूर दीप) with subtle blue flame -->
    <ellipse cx="80" cy="15" rx="20" ry="10" fill="url(#brassThali)" stroke="#875E19" stroke-width="1" />
    <path d="M75 14 Q80 -10 82 14" fill="#60A5FA" opacity="0.8" />
    <path d="M78 14 Q80 -4 81 14" fill="#FFF" />

    <!-- Traditional Center Panchamukhi / Brass Diya (दीपक) -->
    <g transform="translate(0, -10)">
      <!-- Diya Base & Bowl -->
      <path d="M-40 20 Q0 35 40 20 Q48 10 38 0 Q0 -5 -38 0 Q-48 10 -40 20 Z" fill="url(#brassThali)" stroke="#5B3E0C" stroke-width="2" />
      <!-- Golden Oil in Diya -->
      <ellipse cx="0" cy="8" rx="28" ry="8" fill="#F59E0B" />
      <!-- Divine Flame (ज्योति) -->
      <path d="M-15 4 Q0 -70 0 -80 Q0 -70 15 4 Q0 15 -15 4 Z" fill="#FF7700" />
      <path d="M-9 4 Q0 -55 0 -65 Q0 -55 9 4 Q0 10 -9 4 Z" fill="#FFE600" />
      <path d="M-4 4 Q0 -35 0 -45 Q0 -35 4 4 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Devotional Text Ribbon -->
  <rect x="180" y="340" width="240" height="42" rx="21" fill="#8B1E1E" stroke="#D4A64A" stroke-width="2" />
  <text x="300" y="367" font-family="'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="bold" fill="#FFF8E8" text-anchor="middle">मंगल आरती एवं दीप</text>
</svg>
