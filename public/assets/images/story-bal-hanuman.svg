<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFF275" />
      <stop offset="70%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#C65316" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="skyMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A1804" />
      <stop offset="60%" stop-color="#D9581A" />
      <stop offset="100%" stop-color="#FFBD59" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyMid)" />

  <!-- Radiant Golden Sun (भास्कर) -->
  <g transform="translate(450, 140)">
    <circle r="120" fill="url(#sunGlow)" />
    <circle r="55" fill="#FFA500" stroke="#FFE600" stroke-width="4" />
    <!-- Sun Rays -->
    <g stroke="#FFE600" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-80" x2="0" y2="-62" />
      <line x1="0" y1="80" x2="0" y2="62" />
      <line x1="-80" y1="0" x2="-62" y2="0" />
      <line x1="80" y1="0" x2="62" y2="0" />
      <line x1="-58" y1="-58" x2="-45" y2="-45" />
      <line x1="58" y1="58" x2="45" y2="45" />
      <line x1="-58" y1="58" x2="-45" y2="45" />
      <line x1="58" y1="-58" x2="45" y2="-45" />
    </g>
  </g>

  <!-- Bal Maruti in Flight Leaping toward Sun -->
  <g transform="translate(180, 220) rotate(-28)">
    <!-- Speed streaks -->
    <path d="M-90 10 L-20 10" stroke="#FFF" stroke-width="3" opacity="0.6" stroke-linecap="round" />
    <path d="M-80 30 L-30 30" stroke="#FFE" stroke-width="2" opacity="0.5" stroke-linecap="round" />
    <!-- Tail (लांगूल) -->
    <path d="M-30 45 Q-90 20 -70 -30 Q-50 -70 -30 -50" stroke="#F28C28" stroke-width="8" fill="none" stroke-linecap="round" />
    <!-- Body -->
    <ellipse cx="20" cy="20" rx="36" ry="24" fill="#FFAE73" />
    <!-- Arms stretched towards Sun -->
    <path d="M40 10 L100 -5" stroke="#FFAE73" stroke-width="12" stroke-linecap="round" />
    <path d="M35 25 L85 20" stroke="#FFAE73" stroke-width="10" stroke-linecap="round" />
    <!-- Head & Crown -->
    <circle cx="55" cy="0" r="22" fill="#FFAE73" />
    <!-- Golden Ear Kundal -->
    <circle cx="45" cy="8" r="6" fill="#D4A64A" />
    <!-- Bal Mukut -->
    <path d="M50 -18 L70 -12 L60 -32 Z" fill="#D4A64A" stroke="#8B1E1E" stroke-width="1" />
  </g>

  <!-- Clouds -->
  <path d="M40 370 Q100 320 180 350 Q260 310 350 360 Q440 320 560 370 L600 400 L0 400 Z" fill="#4A1005" opacity="0.6" />

  <!-- Badge -->
  <rect x="170" y="340" width="260" height="42" rx="21" fill="#8B1E1E" stroke="#D4A64A" stroke-width="2" />
  <text x="300" y="367" font-family="'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="bold" fill="#FFF8E8" text-anchor="middle">बाल हनुमान और सूर्य देव</text>
</svg>
