<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="tilakHalo" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="65%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>
    <linearGradient id="chandanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="sindoorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#tilakHalo)" />

  <!-- Sun Rays Radiance (सूर्य मंडल तेज) -->
  <g transform="translate(300, 180)" stroke="#FEF08A" stroke-width="2" opacity="0.6">
    <line x1="0" y1="-140" x2="0" y2="-160" />
    <line x1="99" y1="-99" x2="113" y2="-113" />
    <line x1="140" y1="0" x2="160" y2="0" />
    <line x1="99" y1="99" x2="113" y2="113" />
    <line x1="0" y1="140" x2="0" y2="160" />
    <line x1="-99" y1="99" x2="-113" y2="113" />
    <line x1="-140" y1="0" x2="-160" y2="0" />
    <line x1="-99" y1="-99" x2="-113" y2="-113" />
  </g>

  <!-- Sacred Ramanandi Tilak (रामानंदी तिलक) -->
  <g transform="translate(300, 175)">
    <!-- White Chandan U-Shape (श्वेत चन्दन रेखाएँ) -->
    <path d="M-40 -100 L-40 20 C-40 65 40 65 40 20 L40 -100 L24 -100 L24 20 C24 45 -24 45 -24 20 L-24 -100 Z" fill="url(#chandanGrad)" stroke="#D4A64A" stroke-width="1.5" />

    <!-- Center Vermilion / Sindoor Line (मध्य सिंदूर रेखा) -->
    <path d="M-6 -80 L6 -80 L6 30 C6 38 -6 38 -6 30 Z" fill="url(#sindoorGrad)" />
    <!-- Sacred Bindu (बिंदु) -->
    <circle cx="0" cy="45" r="5" fill="url(#sindoorGrad)" />

    <!-- Tulsi Leaf Base (तुलसी दल प्रतीक) -->
    <path d="M0 65 C-12 85 0 100 0 100 C0 100 12 85 0 65 Z" fill="#22C55E" stroke="#15803D" stroke-width="1" />
  </g>

  <!-- Devotional Inscriptions on Side -->
  <text x="300" y="55" font-family="'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="bold" fill="#78350F" text-anchor="middle" letter-spacing="2">॥ जय श्री राम ॥</text>

  <!-- Devotional Label Banner -->
  <rect x="160" y="345" width="280" height="40" rx="20" fill="#8B1E1E" stroke="#D4A64A" stroke-width="2" />
  <text x="300" y="371" font-family="'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="bold" fill="#FFF8E8" text-anchor="middle">रामानंदी तिलक एवं सूर्य तेज</text>
</svg>
